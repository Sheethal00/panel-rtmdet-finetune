# Single source of truth for class names.
# configs/rtmdet_tiny_panel.py, tools/split_coco.py, tools/export_onnx.py,
# and tools/verify_onnx.py all read this file rather than hardcoding names.
#
# Set to the 3 classes actually annotated in Roboflow (MCB, RCBO, RCCB),
# confirmed against the real annotation file: 109 MCB, 16 RCCB, 3 RCBO
# across 15 images. NOTE: the original handoff_annotation_detector.md
# specifies a two-class scheme, which was never resolved against this
# 3-class annotation. Proceeding with 3 classes as the working default --
# it's the safer, reversible choice: 3 classes can always be collapsed to 2
# programmatically after training, but the distinction can't be recovered
# once thrown away. Revisit before this model is treated as final.
classes:
  - MCB
  - RCBO
  - RCCB

# Input resolution used for training and export. Kept at 640x640 to match
# the shape already benchmarked in panel-bench (222.8 ms p50 / 36.3 MB ΔPSS
# on CPU provider, Snapdragon 778G).
input_size: [640, 640]
